<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chikawa Details | Nocturne Press-On Nails</title>
    <link rel="icon" type="image/png" href="images/logo-circle.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* Specific styles for the detail layout */
        .detail-container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            padding: 40px 0;
            margin-top: 40px;
        }
        .detail-image-box {
            flex: 1;
            min-width: 300px;
            background: #141414;
            border: 1px solid #252525;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        .detail-image-box img {
            width: 100%;
            max-height: 450px;
            object-fit: contain;
        }
        .detail-info-box {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .detail-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 4rem;
            color: var(--brand-red);
            margin-bottom: 10px;
        }
        .detail-price {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .detail-description {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #ccc;
            margin-bottom: 30px;
        }
        /* Custom WhatsApp Button Styling */
        .quote-btn {
            display: inline-block;
            background-color: #25d366; /* WhatsApp Green */
            color: #ffffff;
            font-family: 'Roboto', sans-serif;
            font-weight: bold;
            font-size: 1.2rem;
            text-decoration: none;
            text-align: center;
            padding: 15px 30px;
            border-radius: 50px;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }
        .quote-btn:hover {
            transform: translateY(-3px);
            background-color: #20ba5a;
        }
        .back-link {
            color: var(--text-light);
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    
    <div class="stars-overlay"></div>

    <main class="main-content">
        <a href="index.html" class="back-link">← Back to Collection</a>

        <div class="detail-container">
            <div class="detail-image-box">
                <img src="images/nail4.png" alt="Chikawa Press-On Nails">
            </div>

            <div class="detail-info-box">
                <h1 class="detail-title">Chikawa</h1>
                <p class="detail-price">RM 99.00</p>
                
                <p class="detail-description">
                    Get your vibe on with our custom Chikawa press-on set. Fully handcrafted, reusable, and tailored exactly to your size measurements. Includes a full application toolkit.
                </p>

                <a href="https://wa.me/60123022659?text=Hi%20i%20would%20like%20to%20get%20the%20Chikawa%20press%20on%20set!" 
                   target="_blank" 
                   class="quote-btn">
                    Get Quotation via WhatsApp
                </a>
            </div>
        </div>
    </main>

</body>
</html>
